# ╔══════════════════════════════════════════╗
# ║    CrafterConnect - Velocity Config      ║
# ║    crafter.net.tr                        ║
# ╚══════════════════════════════════════════╝

# API Bağlantı Adresi
api-url: "api.crafter.net.tr"

# Website ID (dashboard'dan alınır)
website-id: "YOUR_WEBSITE_ID"

# Plugin Secret (dashboard'dan alınan güvenlik anahtarı)
plugin-secret: "YOUR_PLUGIN_SECRET"

# Proxy sunucusu için ID (dashboard ile eşleşmeli)
server-id: "YOUR_SERVER_ID"

reconnect-delay-seconds: 5
max-reconnect-attempts: -1
ping-interval-seconds: 30
debug: false
use-ssl: true

# Komut güvenliği (TASK-286)
# Bedrock/Floodgate oyuncu adı öneki (tek karakter, örn. "."). Boşsa yalnızca Java adları kabul edilir.
bedrock-player-prefix: ""
# Boş değilse yalnızca bu öneklerle başlayan komutlar çalıştırılır; diğerleri reddedilir (NACK).
# Örnek:
# allowed-command-prefixes:
#   - "lp user"
#   - "give"
allowed-command-prefixes: []
