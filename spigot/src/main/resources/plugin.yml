name: CrafterConnect
version: '${project.version}'
main: net.crafter.plugin.spigot.CrafterSpigotPlugin
api-version: '1.18'
folia-supported: true
description: Crafter store delivery, in-game shop and chest
author: Crafter
website: https://crafter.net.tr
softdepend: [PlaceholderAPI, floodgate, Essentials, CMI]

commands:
  crafter:
    description: CrafterConnect
    usage: /crafter <connect|disconnect|status|reload|magaza|sandik>

permissions:
  crafter.admin:
    description: CrafterConnect management (connect, disconnect, status, reload)
    default: op
  crafter.shop:
    description: In-game store (/crafter magaza)
    default: op
  crafter.chest:
    description: Chest (/crafter sandik)
    default: op
