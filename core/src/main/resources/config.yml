# ╔══════════════════════════════════════════════════════╗
# ║  CrafterConnect 2.0                                  ║
# ║  Paper / Spigot, Velocity, BungeeCord                ║
# ╚══════════════════════════════════════════════════════╝
#
# Connecting:
#   1. Dashboard → Settings → Servers → "Connect a server" and create a connection code.
#   2. Run in the console (or in game with the crafter.admin permission):
#        /crafter connect K7QM-4XPD
#   No website ID, secret or server ID to copy.

# Crafter API address
api-url: "api.crafter.net.tr"

# Server token (cct_…): written by /crafter connect. Do not edit it, share it or show it in screenshots.
# If you think it has leaked, renew it with "Reconnect" in the dashboard.
server-token: ""

# Language: tr, en
language: "tr"

# Allowed command prefixes
# If not empty, only delivery commands starting with one of these run; others are rejected and go to review.
# Do not allow admin commands such as op, stop, whitelist or execute.
# Example:
# allowed-command-prefixes:
#   - "lp user"
#   - "give"
#   - "eco give"
allowed-command-prefixes: []

# Report player joins and leaves to Crafter.
# If the proxy (Velocity/BungeeCord) also runs CrafterConnect, set this to false on the Paper plugins of the backend
# servers so players are not counted twice.
report-players: true

# Playtime and AFK (Paper/Spigot only)
# Time is taken from the game's own statistic (PLAY_ONE_MINUTE) every 5 minutes and on quit; it survives a crash and
# waits in data/playtime.json while disconnected. Velocity/BungeeCord do not send time (players are not counted twice).
playtime:
  enabled: true
  # Sample interval in minutes (1-60)
  sample-minutes: 5
  # AFK source: auto (Essentials, otherwise CMI, otherwise idle), essentials, cmi, idle, none
  afk-source: auto
  # Idle threshold in minutes (used for afk-source idle, or auto when no AFK plugin is installed)
  afk-minutes: 5
  # true: each player's past total on this server is imported once with the first sample. Leave off if this server
  # already counted playtime with the old plugin (it would be counted twice).
  import-history: false

# Verbose logging
debug-mode: false

# --- Advanced ---
use-ssl: true
reconnect-delay-seconds: 5
max-reconnect-attempts: -1
# Bedrock player name prefix when Floodgate is not installed (single character, e.g. "."). Read from Floodgate otherwise.
bedrock-player-prefix: ""

# --- Legacy connection (before 2.0) ---
# Used only when server-token is empty and these fields are set. Switch to 2.0 with "Reconnect" in the dashboard.
# website-id: ""
# plugin-secret: ""
# server-id: ""
