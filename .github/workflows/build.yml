name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Her zaman temiz derleme: bayat target/ içeriği jar'a karışmaz
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: crafter-connect-jars
          path: |
            spigot/target/crafter-connect-spigot-*.jar
            velocity/target/crafter-connect-velocity-*.jar
            bungee/target/crafter-connect-bungee-*.jar
          if-no-files-found: error
